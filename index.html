<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groupings</title>
  <meta name="description" content="Groupings — a word grouping puzzle game for iOS.">
  <style>
    :root {
      --bg: #0e1116;
      --fg: #f2f4f8;
      --muted: #9aa4b2;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 540px; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0 0 0.25em;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); font-size: 1.15rem; line-height: 1.6; margin: 0; }
    .badge {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Groupings</h1>
    <p>A word grouping puzzle game. Website coming soon.</p>
    <span class="badge">Coming soon</span>
  </main>
</body>
</html>
